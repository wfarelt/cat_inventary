{% extends "base.html" %}

{% block content %}
<div class="p-4 bg-white rounded shadow">
  {% if kit %}<h2 class="text-lg font-bold">Editar Kit</h2>{% else %}<h2 class="text-lg font-bold">Nuevo Kit</h2>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-2">
      <button class="bg-blue-600 text-white px-3 py-1 rounded">Guardar</button>
      <a href="{% url 'kit_list' %}" class="ml-2">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
