{% extends 'base.html' %}

{% block content %}
<div class="p-4">
  <h2 class="text-xl font-bold mb-4">Cash Movements</h2>
  <table class="w-full">
    <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Reference</th><th>Notes</th></tr></thead>
    <tbody>
      {% for m in movements %}
      <tr>
        <td>{{ m.created_at }}</td>
        <td>{{ m.get_movement_type_display }}</td>
        <td>{{ m.amount }}</td>
        <td>{{ m.reference }}</td>
        <td>{{ m.notes }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="5">No movements</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
