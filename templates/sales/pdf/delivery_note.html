<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Delivery Note {{ sale.number }}</title>
  <style>body{font-family: Arial, sans-serif; font-size:12px} table{width:100%; border-collapse: collapse} th,td{border:1px solid #ccc; padding:6px}</style>
</head>
<body>
  <h2>Nota de Entrega</h2>
  <div>No: {{ sale.number }} - Fecha: {{ sale.sale_date }}</div>
  <h4>Cliente</h4>
  <div>{{ sale.customer.name }}</div>
  <table>
    <thead><tr><th>Producto</th><th>Cantidad</th></tr></thead>
    <tbody>
      {% for it in sale.items.all %}
      <tr><td>{{ it.product.code }} - {{ it.product.description }}</td><td>{{ it.quantity }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
