{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-xl font-semibold mb-4">Iniciar sesión</h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
      <button type="submit" class="bg-yellow-500 text-black px-4 py-2 rounded">Entrar</button>
    </div>
  </form>
</div>
{% endblock %}
