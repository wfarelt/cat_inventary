{% extends "base.html" %}

{% block content %}
<div class="bg-white p-4 rounded shadow max-w-md">
  <h2 class="text-lg font-bold">{{ title }}</h2>
  <form method="post" class="mt-4 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
      <button class="bg-yellow-500 text-black px-3 py-1 rounded">Guardar</button>
      <a href="{% url 'company_list' %}" class="ml-2">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
