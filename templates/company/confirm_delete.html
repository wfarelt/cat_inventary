{% extends "base.html" %}

{% block content %}
<div class="bg-white p-4 rounded shadow max-w-md">
  <h2 class="text-lg font-bold">Confirmar eliminación</h2>
  <p>¿Deseas desactivar la empresa <strong>{{ company.name }}</strong>?</p>
  <form method="post" class="mt-4">
    {% csrf_token %}
    <button class="bg-red-500 text-white px-3 py-1 rounded">Sí, desactivar</button>
    <a href="{% url 'company_list' %}" class="ml-2">Cancelar</a>
  </form>
</div>
{% endblock %}
