{% extends "base.html" %}

{% block content %}
<div class="bg-white p-4 rounded shadow">
  <h2 class="text-lg font-bold">Usuarios</h2>
  <table class="min-w-full mt-4">
    <thead>
      <tr>
        <th>Usuario</th>
        <th>Nombre</th>
        <th>Rol</th>
        <th>Activo</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.get_full_name }}</td>
        <td>{{ u.get_role_display }}</td>
        <td>{{ u.is_active }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4">No hay usuarios.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
